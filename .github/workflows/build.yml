name: Build RPM

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish RPMs to a GitHub Release
        required: false
        default: false
        type: boolean
      release_tag:
        description: Release tag. Defaults to v<version>-<release>.
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_NDK_VERSION: '27.2.12479018'
      SAILFISH_IMAGE: coderus/sailfishos-platform-sdk@sha256:31ba115546972af3630f4690acc204a4e09701358ae39be1883ca70e0eadda86
      SAILFISH_TARGET: SailfishOS-5.1.0.11-aarch64
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Read package version
        id: package
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag || '' }}
        run: |
          set -euo pipefail
          version="$(awk '$1 == "Version:" { print $2; exit }' rpm/rawfish.spec)"
          release="$(awk '$1 == "Release:" { print $2; exit }' rpm/rawfish.spec)"
          test -n "$version"
          test -n "$release"
          tag="${INPUT_RELEASE_TAG:-v${version}-${release}}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "RPM version: ${version}-${release}"

      - name: Build Android Camera2 bridge
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          sh sfos-camera2-bridge/scripts/build-android.sh
          test -s sfos-camera2-bridge/build/android/libsfoscamera2.so

      - name: Build and verify Sailfish RPM
        id: build_rpm
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p RPMS
          chmod a+w RPMS
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -e SAILFISH_TARGET \
            "$SAILFISH_IMAGE" /bin/bash -euc '
              mkdir -p "$HOME/rawfish-build"
              cd "$HOME/rawfish-build"
              cp -a /workspace/. .
              test -s sfos-camera2-bridge/build/android/libsfoscamera2.so
              mb2 -t "$SAILFISH_TARGET" build
              found=0
              for package in RPMS/rawfish-[0-9]*.aarch64.rpm; do
                test -f "$package" || continue
                rpm -qpl "$package" > /tmp/rawfish-files.txt
                grep -Fx /usr/bin/rawfish /tmp/rawfish-files.txt
                grep -Fx /usr/libexec/rawfish/sfos-camera2-probe /tmp/rawfish-files.txt
                grep -Fx /usr/libexec/droid-hybris/system/lib64/libsfoscamera2.so /tmp/rawfish-files.txt
                found=1
              done
              test "$found" -eq 1
              cp RPMS/*.rpm /workspace/RPMS/
            '
          rpm_count="$(find RPMS -maxdepth 1 -name 'rawfish-*.aarch64.rpm' | wc -l)"
          test "$rpm_count" -ge 1
          rpm_name="$(basename "$(find RPMS -maxdepth 1 -name 'rawfish-*.aarch64.rpm' | sort | head -n 1)")"
          echo "rpm_name=${rpm_name}" >> "$GITHUB_OUTPUT"
          echo "Built ${rpm_name}"

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build_rpm.outputs.rpm_name }}
          path: RPMS/*.rpm
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            tag="${{ steps.package.outputs.tag }}"
          fi
          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$tag" RPMS/*.rpm \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "$tag" RPMS/*.rpm \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "RAWfish $tag" \
              --notes "RAWfish $tag"
          fi
